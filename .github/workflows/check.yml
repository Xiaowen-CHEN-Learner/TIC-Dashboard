name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule checks
        run: python tools/check.py
      - name: Build the dashboard
        run: python tools/build_static.py --single
      - name: Upload preview (download from the run's Artifacts section)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: site/
          retention-days: 14
