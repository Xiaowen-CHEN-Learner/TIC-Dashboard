name: pages

# Publishes the dashboard to GitHub Pages from main, after the rule checks pass.
# It runs only while the repository variable ENABLE_PAGES is "true" and the Pages
# source is "GitHub Actions". Set the variable to "false" to stop publishing.
# A Pages site can be reached by anyone with the link.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A running deployment is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule checks
        run: python tools/check.py
      - name: Build the dashboard
        run: python tools/build_static.py --single
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # A job of its own. When the deploy step ran straight after the upload in one job, it
  # sometimes asked for the built site before the upload was listed, and failed with
  # "No artifacts named github-pages were found". Starting a new job gives it time.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
