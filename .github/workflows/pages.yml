name: pages

# Optional. Publishes the dashboard to GitHub Pages from main.
# It does nothing until the owner sets the repository variable ENABLE_PAGES to "true"
# and chooses "GitHub Actions" as the Pages source. A Pages site can be reached by
# anyone with the link.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule checks
        run: python tools/check.py
      - name: Build the dashboard
        run: python tools/build_static.py --single
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
